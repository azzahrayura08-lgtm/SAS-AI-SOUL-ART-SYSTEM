name: Build SAS AI Web and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: sas-ai-web-dist
          path: dist/
          if-no-files-found: error

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"; fi
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app into Android project
        run: npx cap sync android
      - name: Configure Gradle download reliability
        run: |
          PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.2.1-bin.zip/' "$PROPS"
          printf '\nnetworkTimeout=120000\nretries=3\nretryBackOffMs=2000\n' >> "$PROPS"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sas-ai-soul-art-system-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
